name: Verify Swivel
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - name: Verify synthetic-bank replay, recovery and human handoff
        shell: bash
        run: |
          set -euo pipefail
          npm run hosted > "$RUNNER_TEMP/swivel.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:4700");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          npm run test:demo
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: replay-diagnostics
          path: |
            test-results/
            ${{ runner.temp }}/swivel.log
          retention-days: 3
